name: Sync HA Version

on:
  workflow_dispatch:
  push:
    paths:
      - requirements.txt
  pull_request:
    paths:
      - requirements.txt

permissions:
  contents: write
  pull-requests: write

jobs:
  hassfest: # https://developers.home-assistant.io/blog/2020/04/16/hassfest
    name: Hassfest validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v6.0.1

      - name: Extract Home Assistant version from requirements.txt
        id: ha_version
        run: |
          HA_VERSION=$(grep '^homeassistant==' requirements.txt | sed 's/homeassistant==//')
          echo "ha_version=$HA_VERSION" >> $GITHUB_OUTPUT

      - name: Update hacs.json with Home Assistant version
        run: |
          jq --arg ver "${{ steps.ha_version.outputs.ha_version }}" '.homeassistant = $ver' hacs.json > hacs.json.tmp && mv hacs.json.tmp hacs.json

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add hacs.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update hacs.json Home Assistant version to ${{ steps.ha_version.outputs.ha_version }}"
            git push
          fi